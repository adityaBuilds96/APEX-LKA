# ==============================================================================
# APEX-LKA Jetson Orin Nano Deployment Configuration
# SAE BAJA 2027 Autonomous Lane Keep Assist Platform
# ==============================================================================

camera:
  type: "auto"          # Options: csi | usb | rtsp | auto
  device_id: 0          # Camera index or sensor ID
  resolution: [640, 360] # [Width, Height] matching model training dimensions
  fps: 30               # Target capture frame rate
  flip_method: 0        # 0: None, 2: 180 flip (for inverted mount)
  csi_sensor_id: 0      # CSI camera sensor-id (0 for J13 / CAM0 on Orin Nano)
  rtsp_url: ""          # Optional RTSP network stream URL

inference:
  engine_path: "models/exported/best_model.plan"   # High-speed TensorRT engine
  fallback_onnx: "models/exported/best_model.onnx" # Universal ONNX model
  device: "cuda"                                  # Execution target: cuda | cpu
  confidence_threshold: 0.50                      # Minimum confidence for lane acceptance
  road_confidence_threshold: 0.40                 # Minimum confidence for drivable road

vehicle:
  lane_width_meters: 3.7        # Standard lane width for single-lane offset reference
  max_steering_angle_deg: 30.0  # Max steering rack angle (+/- degrees)
  max_speed_mps: 10.0           # Maximum vehicle velocity (SAE BAJA speed limit)
  camera_height_meters: 1.2     # Camera mounting height from ground
  lookahead_meters: 5.0         # Pure pursuit steering lookahead distance
  kp_steering: 12.0             # Proportional gain for lateral offset (deg / meter)
  kd_steering: 2.5              # Derivative gain for heading / curvature damping

communication:
  serial:
    enabled: true
    port: "/dev/ttyUSB0"        # USB-to-Serial connection to Arduino Mega 2560
    baudrate: 115200            # Standard high-speed telemetry baudrate
    arduino_id: "steering"      # Packet header identifier
    timeout_sec: 0.05           # Non-blocking write timeout
  can:
    enabled: true
    interface: "can0"           # Jetson native CAN interface (SN65HVD230 transceiver)
    channel: "can0"
    bustype: "socketcan"        # Linux SocketCAN protocol
    bitrate: 500000             # 500 kbps automotive CAN bus
    steering_message_id: 0x100  # CAN ID for vehicle steering command
    telemetry_message_id: 0x101 # CAN ID for perception telemetry & status

safety:
  max_consecutive_failures: 30  # Max consecutive frame misses before E-STOP (1.0s at 30 FPS)
  emergency_stop_confidence: 0.20 # Confidence threshold triggering safety halt
  watchdog_timeout_ms: 500      # Heartbeat watchdog expiry threshold
  failsafe_steering_deg: 0.0    # Center steering wheel on emergency stop

logging:
  enabled: true
  directory: "deploy/logs"      # Persistent telemetry storage directory
  rotate_size_mb: 100           # Rotate log file when exceeding this size
  log_frequency_hz: 30          # Log every frame or sub-sample
