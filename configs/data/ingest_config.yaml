# ==============================================================================
# APEX-Vision | Real-Time ADAS & Autonomous Lane Perception Platform
# Configuration: Universal Dataset Ingest Engine
# Target: ISO 26262 ASIL-B Data Pipeline Standards
# ==============================================================================

version: "4.0.0"
component: "universal_dataset_ingest_engine"

# ------------------------------------------------------------------------------
# Input Data Sources & Vault Configuration
# ------------------------------------------------------------------------------
sources:
  primary_archive:
    path: "data/raw/lane_dataset.zip"
    fallback_path: "data/lane_dataset.zip"
    archive_type: "zip"
    format: "tusimple"
    description: "Multi-folder TuSimple archive with image clips and label JSONs"
    expected_md5: null
    max_decompressed_bytes_per_chunk: 134217728 # 128 MB RAM protection chunk
    allow_streaming_extraction: true
    zip_slip_prevention: true

  staging:
    temp_dir: "data/.staging"
    clean_on_start: false
    clean_on_success: true

  quarantine:
    path: "data/quarantine"
    retain_bad_samples: true
    max_quarantine_files: 50000

# ------------------------------------------------------------------------------
# Target Processed Dataset Configuration
# ------------------------------------------------------------------------------
processed:
  output_root: "data/processed"
  images_dir: "data/processed/images"
  masks_dir: "data/processed/masks"
  manifest_path: "data/processed/manifest.jsonl"
  split_path: "data/processed/split.json"
  summary_report_path: "data/processed/ingest_summary.json"

  # Standardized spatial dimensions for perception backbone
  target_width: 640
  target_height: 360
  channels: 3
  color_space: "RGB"
  image_format: "jpg"
  image_quality: 95
  mask_format: "png"
  mask_compression_level: 6

# ------------------------------------------------------------------------------
# Dataset Partitioning & Split Rules
# ------------------------------------------------------------------------------
split:
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  random_seed: 42
  stratify_by_clip: true
  preserve_sequence_continuity: true
  split_by_clip_prefix: true # Ensure sequential clips are never split across train/val/test

# ------------------------------------------------------------------------------
# 4-Class Semantic Label Schema Definition
# ------------------------------------------------------------------------------
label_schema:
  classes:
    - id: 0
      name: "background"
      color_rgb: [0, 0, 0]
      color_bgr: [0, 0, 0]
      hex: "#000000"
      description: "Non-drivable regions, environment, horizon, sky, hoods, off-road terrain"
      is_drivable: false
      is_lane_line: false

    - id: 1
      name: "drivable_corridor"
      color_rgb: [128, 64, 128]
      color_bgr: [128, 64, 128]
      hex: "#804080"
      description: "Drivable travel corridor bounded between ego left and ego right lanes"
      is_drivable: true
      is_lane_line: false

    - id: 2
      name: "left_boundary"
      color_rgb: [0, 255, 0]
      color_bgr: [0, 255, 0]
      hex: "#00FF00"
      description: "Immediate ego left lane boundary marking (continuous or dashed)"
      is_drivable: false
      is_lane_line: true

    - id: 3
      name: "right_boundary"
      color_rgb: [255, 100, 0]
      color_bgr: [0, 100, 255]
      hex: "#FF6400"
      description: "Immediate ego right lane boundary marking (continuous or dashed)"
      is_drivable: false
      is_lane_line: true

  # Default rasterization stroke settings
  lane_stroke_width_px: 6
  polygon_fill_corridor: true
  interpolate_spline_points: true
  spline_sampling_interval_px: 4

# ------------------------------------------------------------------------------
# TuSimple Format Adapter Parameters
# ------------------------------------------------------------------------------
tusimple_adapter:
  annotation_patterns:
    - "label_data_*.json"
    - "test_label.json"
    - "test_label_new.json"
  sample_frame_index: 20 # 20th frame in clip is annotated
  min_valid_points: 3
  filter_out_of_bounds: true
  discard_single_lane_clips: false
  interpolate_missing_points: true
  corridor_fill_min_lane_count: 2
  max_lateral_deviation_px: 50.0

# ------------------------------------------------------------------------------
# Data Integrity, Deduplication & Quality Gates
# ------------------------------------------------------------------------------
integrity:
  enable_sha256_deduplication: true
  enable_dhash_near_dedup: true
  dhash_distance_threshold: 2
  strip_exif_metadata: true
  enforce_strict_aspect_ratio: false
  min_input_width: 320
  min_input_height: 180
  max_aspect_ratio_deviation: 0.35
  quarantine_on_corruption: true
  quarantine_on_empty_mask: false # Set true only for strictly labeled sets

# ------------------------------------------------------------------------------
# High-Throughput Streaming & Concurrency
# ------------------------------------------------------------------------------
runtime:
  num_workers: 4
  stream_batch_size: 64
  chunk_buffer_mb: 256
  gc_frequency_batches: 10
  log_progress_every_n: 100
  show_live_progress: true
  error_handling_mode: "quarantine_and_continue" # options: fail_fast, quarantine_and_continue, ignore

# ------------------------------------------------------------------------------
# Verification & Audit Logging
# ------------------------------------------------------------------------------
audit:
  export_visual_samples: true
  sample_export_count: 24
  sample_export_dir: "data/processed/.audit_samples"
  record_per_sample_timings: false
  hash_algorithm: "sha256"
  sign_manifest: true

# ------------------------------------------------------------------------------
# Augmentation Policy (Strict Autonomous Driving Rules)
# ------------------------------------------------------------------------------
augmentation_policy:
  horizontal_flip_allowed: false
  horizontal_flip_class_swap: true # Only if horizontal_flip is explicitly forced
  rotation_limit_deg: 3.0
  vertical_shift_limit_pct: 0.05
  horizontal_shift_limit_pct: 0.05
  brightness_limit: 0.20
  contrast_limit: 0.20
  blur_limit: 5
  color_jitter_prob: 0.40
  shadow_simulation: true
  forbidden_transforms:
    - "HorizontalFlip"
    - "VerticalFlip"
    - "ElasticTransform"
    - "GridDistortion"
    - "CoarseDropout"

# ------------------------------------------------------------------------------
# Normalization Parameters
# ------------------------------------------------------------------------------
normalization:
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  mask_dtype: "uint8"
  image_dtype: "uint8"

# ------------------------------------------------------------------------------
# End of Ingest Engine Configuration
# ==============================================================================
