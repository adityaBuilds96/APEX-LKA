# =============================================================
# Lane Keep Assist (LKA) - Master Project Configuration
# =============================================================
# This file controls ALL tunable parameters.
# Never hardcode parameters inside scripts.

project:
  name: "LaneKeepAssist"
  version: "1.0.0"
  description: "Portfolio-grade Lane Detection and LKA System"

# ------- Paths (relative to project root) --------------------
paths:
  raw_videos:     "data/raw_videos"
  raw_frames:     "data/raw_frames"
  annotated:      "data/annotated"
  train:          "data/train"
  val:            "data/val"
  test:           "data/test"
  annotations:    "annotations"
  models:         "models"
  checkpoints:    "models/checkpoints"
  exported:       "models/exported"
  logs:           "logs"
  results:        "results"

# ------- Data Collection (Frame Extraction) ------------------
data_collection:
  target_fps: 5           # Extract this many frames per second
  source_fps: null        # null = auto-detect from video
  duplicate_threshold: 0.98  # Skip frame if structural similarity > this
  resize_on_extract: false   # Resize during extraction (saves disk)
  output_format: "jpg"    # jpg or png
  jpeg_quality: 95

# ------- Preprocessing ---------------------------------------
preprocessing:
  image_width: 640
  image_height: 360
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet means (RGB)
  normalize_std:  [0.229, 0.224, 0.225]   # ImageNet stds  (RGB)
  # Region of Interest: crop bottom portion of frame
  # [y_start_fraction, y_end_fraction] — 0.0=top, 1.0=bottom
  roi_y_start: 0.35
  roi_y_end:   1.0

# ------- Dataset Split ---------------------------------------
dataset:
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  random_seed: 42

# ------- Augmentation ----------------------------------------
augmentation:
  enabled: true
  # Geometric (apply carefully — must preserve lane geometry)
  horizontal_flip: false       # NEVER flip: it mirrors the road incorrectly
  random_rotate_limit: 5       # Max rotation in degrees (small!)
  random_translate_x: 0.05    # Max horizontal translate fraction
  random_translate_y: 0.02    # Max vertical translate fraction
  # Photometric (safe — does not distort geometry)
  brightness_limit: 0.3
  contrast_limit:   0.3
  blur_limit:       3
  gaussian_noise_std: 0.02
  # Synthetic effects
  shadow_simulation: true
  rain_simulation:   false     # Use only if you have rain data to match

# ------- Model (Semantic Segmentation) -----------------------
model:
  model_name: "APEX-RLP"       # Configurable model name
  architecture: "LaneSegNet"   # Custom lightweight segmentation model
  backbone: "mobilenet_v3_small" # Lightweight backbone for real-time
  fpn_channels: 128
  num_classes: 3               # 0=background, 1=left_lane, 2=right_lane (baseline)
  target_num_classes: 4        # 0=background, 1=road, 2=left_lane, 3=right_lane (dynamic)
  pretrained_backbone: true
  input_channels: 3            # RGB
  param_limit_min: 3000000
  param_limit_max: 5000000
  # Checkpoint
  best_model_metric: "val_mean_iou"
  save_every_n_epochs: 1

# ------- Training --------------------------------------------
training:
  epochs: 50
  batch_size: 8
  learning_rate: 0.001
  lr_scheduler: "cosine"       # cosine | step | plateau
  weight_decay: 0.0001
  optimizer: "adam"            # adam | sgd | adamw
  loss: "combined"             # combined = dice + cross_entropy + boundary
  dice_weight: 0.4
  ce_weight: 0.4
  boundary_weight: 0.2
  num_workers: 0               # Set to 0 on Windows to avoid multiprocessing issues
  pin_memory: false
  early_stopping_patience: 10  # Stop if val_iou doesn't improve for N epochs
  gradient_clip: 1.0

# ------- Model Export & Edge Optimization --------------------
export:
  opset_version: 17
  dynamic_batch: true
  fp16: true
  simplify: true
  tensorrt_workspace_mb: 512
  tensorrt_fp16: true
  parity_tolerance: 1e-3
  parity_test_frames: 100

# ------- Advanced Training Features (RTX 4060 Optimized) -----
training_advanced:
  mixed_precision: true
  gradient_accumulation_steps: 1
  ema_decay: 0.999
  label_smoothing: 0.05
  warmup_epochs: 5
  cosine_restart_epochs: 15
  progressive_unfreezing: true
  unfreeze_schedule: [5, 15]

robustness:
  max_consecutive_failures: 10
  max_total_failures: 50
  memory_monitor_interval_sec: 30
  gpu_temp_threshold_celsius: 85
  disk_space_min_gb: 1.0
  auto_batch_size_reduction: true
  thermal_cooldown_sec: 5

rtx4060_optimized:
  default_batch_size: 8
  default_num_workers: 4
  default_pin_memory: true


# ------- Evaluation Metrics ----------------------------------
evaluation:
  primary_metric: "mean_iou"
  metrics:
    - "mean_iou"
    - "dice_coefficient"
    - "pixel_accuracy"
    - "precision"
    - "recall"
    - "f1_score"
  iou_threshold: 0.5

# ------- Lane Geometry ---------------------------------------
lane_geometry:
  # Polynomial degree for lane curve fitting
  poly_degree: 2
  # Minimum number of lane pixels to consider it a valid detection
  min_lane_pixels: 50
  # Perspective transform ROI (fraction of image)
  # [top_left, top_right, bottom_right, bottom_left] in (x_frac, y_frac)
  perspective_src:
    - [0.43, 0.60]
    - [0.57, 0.60]
    - [0.90, 1.00]
    - [0.10, 1.00]
  perspective_dst:
    - [0.25, 0.00]
    - [0.75, 0.00]
    - [0.75, 1.00]
    - [0.25, 1.00]

# ------- Steering Controller (Proportional-Derivative) -------
steering:
  # Coordinate convention:
  #   lateral_error > 0  → vehicle is RIGHT of lane center → steer LEFT
  #   lateral_error < 0  → vehicle is LEFT  of lane center → steer RIGHT
  Kp: 0.5           # Proportional gain
  Kd: 0.1           # Derivative gain
  # Thresholds
  keep_center_threshold: 0.05   # |error| < this → KEEP CENTER (normalized units)
  low_confidence_iou: 0.30      # IoU below this → LOW CONFIDENCE warning
  # Saturation
  max_steering_command: 1.0     # Normalized [-1, 1]

# ------- Inference -------------------------------------------
inference:
  device: "cpu"               # cpu | cuda | mps
  confidence_threshold: 0.50  # Minimum model confidence to trust output
  target_fps: 15              # Target real-time FPS
  show_overlay: true
  show_fps: true
  log_to_csv: true
  log_path: "logs/inference/inference_log.csv"
  # Camera
  webcam_id: 0
  webcam_width: 1280
  webcam_height: 720

# ============================================================
# Phase 2: Data Infrastructure & Automation Configs
# ============================================================

auto_annotation:
  enabled: true
  road_surface:
    hls_lightness_range: [20, 180]
    hls_saturation_max: 80
    morph_kernel_size: 15
    flood_fill_seed: "bottom_center"     # (W/2, H-1)
  lane_marking:
    line_thickness_px: 14                # Rasterized lane width in pixels
    min_hough_lines: 3                   # Minimum Hough detections per side
    polynomial_degree: 2                 # Match lane_geometry config
  confidence:
    high_threshold: 0.70
    medium_threshold: 0.40
    auto_approve_above: 0.70
  output:
    save_overlay_preview: true           # Save image+mask overlay for visual QC
    overlay_alpha: 0.4                   # Mask transparency in overlay preview
    log_path: "annotations/auto_annotation_log.json"

upload:
  staging_dir: "data/.staging"
  max_file_size_mb: 500
  max_batch_size_gb: 5
  accepted_image_formats: ["jpg", "jpeg", "png", "bmp", "tiff", "webp"]
  accepted_video_formats: ["mp4", "avi", "mov", "mkv"]
  accepted_archive_formats: ["zip"]
  thumbnail_size: [200, 120]
  thumbnail_quality: 80
  thumbnail_dir: "data/.thumbnails"
  cleanup_staging_after_hours: 24

quality_scoring:
  dimension_mismatch_severity: "critical"
  illegal_class_id_severity: "critical"
  road_coverage_min: 0.10
  road_coverage_max: 0.85
  lane_coverage_min: 0.005
  lane_coverage_max: 0.08
  lane_width_min_px: 100
  lane_width_max_px: 400
  max_lane_fragments: 3
  sky_region_top_fraction: 0.30
  weights:
    critical: 3.0
    warning: 1.5
    info: 0.5
  thresholds:
    excellent: 0.85
    acceptable: 0.65
    needs_review: 0.40

pipeline:
  batch_id_method: "uuid4"
  state_file: "annotations/pipeline_state.json"
  auto_split_after_annotation: false
  parallel_workers: 2
  progress_poll_interval_sec: 0.5

# ============================================================
# Universal Lane & Path Detection Configuration
# ============================================================
lane_detection_universal:
  mode: "auto"  # auto | painted | edge | drivable
  road_surface_detection: true
  min_line_length_ratio: 0.15
  max_slope_absolute: 2.0
  temporal_smoothing:
    enabled: true
    buffer_size: 5
    ema_alpha: 0.6
    outlier_threshold: 0.30
    max_gap_frames: 3
  performance:
    processing_resolution: [480, 270]
    target_fps: 30

# ============================================================
# Multi-Task Autonomous Scene Perception Configuration (Phase 4)
# ============================================================
scene_perception:
  environmental_adaptation: true
  clahe_clip_limit: 3.0
  clahe_grid_size: [8, 8]
  camera_calibration:
    mounting_height_m: 1.25
    pitch_angle_deg: 0.0
    focal_length_px: 500.0
    horizon_y_px: 126  # 0.35 * 360
  temporal_smoothing:
    enabled: true
    buffer_depth: 5
    ema_alpha: 0.65
    max_lateral_jump_m: 0.50
    hold_gap_frames: 3

# ============================================================
# Optical Calibration & Kinematic Control Configuration (Section 5)
# ============================================================
camera_intrinsics:
  fx: 500.0
  fy: 500.0
  cx: 320.0
  cy: 180.0

paths_extra:
  camera_extrinsics: "configs/camera_extrinsics.yaml"
  bev:               "configs/bev.yaml"
  actuation:         "configs/actuation_profile.yaml"

perception_runtime:
  road_first: true
  horizon_from_extrinsics: true
  poly_degree_bev: 2
  ransac_iters: 50
  ransac_inlier_tol_m: 0.08
  ekf:
    enabled: true
    process_noise: 1.0e-3
    measurement_noise: 2.0e-2
    max_innov_m: 0.5
    max_hold_frames: 3
  quality:
    min_inliers: 40
    min_coverage: 0.15
    attenuate_below: 0.5

control:
  wheelbase_m: 1.60
  stanley:
    k: 1.1
    epsilon_v: 0.3
  pure_pursuit:
    L_min: 1.5
    L_max: 6.0
    k_speed: 0.4
  switching:
    kappa_switch: 0.08
    hysteresis: 0.02
  limits:
    delta_max_deg: 30
    delta_rate_max_dps: 120
  quality_scaling:
    min_scale: 0.3
    full_scale_above: 0.75

# ============================================================
# Section 6 — Hardware-In-The-Loop, Camera & Certification
# ============================================================
paths_extra_section6:
  camera_intrinsics: "configs/camera_intrinsics.yaml"
  camera_profiles:   "configs/camera_profiles.yaml"
  hil:               "configs/hil.yaml"
  fault_matrix:      "configs/fault_matrix.yaml"

camera_runtime:
  target_fps: 30
  depth1_capture: true
  monotonic_timestamps: true
  exposure_control:
    enabled: true
    target_lightness: 118
    tolerance: 10
    update_every_n_frames: 5
  awb_lock_after_frames: 60
  tone_mapping:
    adaptive_clahe: true
    clip_min: 1.5
    clip_max: 4.0
  glare_suppression:
    enabled: true
    highlight_thresh: 240
    bloom_min_area_px: 150
  occlusion_detector:
    enabled: true
    sharpness_min: 25.0
    frames_to_trigger: 10
  distortion_correction:
    enabled: true
  frame_hashing:
    enabled: true
    every_n_frames: 15
  supervisor:
    jitter_warn_ms: 8
    jitter_fault_ms: 20
    hotplug_retry_backoff_s: [1, 2, 4, 8]

certification_budgets:
  latency_p50_ms: 15
  latency_p95_ms: 25
  latency_p99_ms: 40
  fps_floor: 30
  ram_peak_mb: 1400
  watchdog_recovery_ms: 500

# ============================================================
# Phase 5: Section 1 — Multi-Object Detection & Risk Assessment
# ============================================================
object_detection:
  enabled: true
  model_path: "models/exported/multitask_best.onnx"
  engine_path: "models/exported/multitask_best.plan"
  confidence_threshold: 0.35
  nms_threshold: 0.45
  classes:
    0: "vehicle"
    1: "pedestrian"
    2: "cyclist"
    3: "traffic_cone"
    4: "barrier"
    5: "animal"
    6: "debris"
    7: "traffic_sign"
    8: "traffic_light"

risk_assessment:
  emergency_brake_risk_threshold: 85
  proximity_brake_threshold: 0.75
  corridor_padding_px: 20

# ============================================================
# Phase 5: Section 2 — 3D Scene Depth & Occupancy Grid
# ============================================================
depth_estimation:
  enabled: true
  model_path: "models/exported/depth_best.onnx"
  engine_path: "models/exported/depth_best.plan"
  metric_scale: 15.0
  metric_shift: 0.1

occupancy_grid:
  grid_resolution_m: 0.10
  x_min_m: -5.0
  x_max_m: 5.0
  z_min_m: 0.0
  z_max_m: 15.0
  raycast_shadows: true

# ============================================================
# Phase 5: Section 3 — Perception Recovery, Tracking & Trajectory
# ============================================================
lane_perfection:
  lab_b_min: 145
  hls_l_min: 200
  ransac_iterations: 50
  ransac_threshold_px: 3.0
  min_lane_width_px: 150
  max_lane_width_px: 380

object_tracking:
  enabled: true
  track_thresh: 0.45
  track_buffer_frames: 30
  match_thresh: 0.80

trajectory_prediction:
  horizon_seconds: 3.0
  tti_warning_threshold_s: 2.5
  tti_critical_threshold_s: 1.0

# ============================================================
# Phase 5: Section 4 — Sensor Fusion & State Estimation
# ============================================================
sensor_fusion:
  enabled: true
  eskf:
    imu_accel_noise: 0.05
    imu_gyro_noise: 0.005
    accel_bias_noise: 0.001
    gyro_bias_noise: 0.0001
    gnss_pos_noise: 0.5
    rtk_pos_noise: 0.02
  vio:
    enabled: true
    max_features: 200
    min_feature_inliers: 30
  vehicle_kinematics:
    wheelbase_m: 1.60
    track_width_m: 1.25
    understeer_gradient: 0.002
  lane_retention:
    max_hold_seconds: 5.0
    confidence_decay_per_sec: 0.15

# ============================================================
# Phase 5: Section 5 — Decision Planning & Path Planner
# ============================================================
planning:
  enabled: true
  behavior:
    default_speed_limit_mps: 4.17  # 15 km/h
    standstill_distance_m: 2.0
    time_gap_seconds: 1.5
    max_accel_mpss: 1.5
    max_decel_mpss: 3.0
    emergency_decel_mpss: 4.5
  path_planner:
    horizon_seconds: 3.0
    num_waypoints: 30
    obstacle_clearance_m: 1.0
  rss_shield:
    response_time_sec: 0.5
    min_brake_mpss: 3.0
    max_brake_mpss: 5.0

# ============================================================
# Phase 5: Section 6 — OTA Updates & Fleet Infrastructure
# ============================================================
fleet_ota:
  enabled: true
  public_key_path: "keys/apex_ota_public.pem"
  check_interval_sec: 300
  remote_manifest_url: "https://fleet.apexlka.internal/v1/manifest.json"
shadow_mode:
  enabled: true
  candidate_model_path: "models/candidate/shadow_model.onnx"
  divergence_threshold_m: 0.40
data_harvesting:
  enabled: true
  storage_quota_mb: 2048
  trigger_confidence_low: 0.40
  trigger_divergence_m: 0.40
  pre_event_frames: 2
  post_event_frames: 2

# ============================================================
# Phase 5: Section 7 — Simulation, Digital Twin & Validation
# ============================================================
simulation:
  enabled: true
  config_path: "configs/simulation.yaml"
  default_map: "college_campus"
  default_weather: "clear_noon"
  ci_regression_pass_rate_pct: 95.0

# ============================================================
# Phase 5: Section 8 — Universal Deployment & Industrial Certification
# ============================================================
deployment:
  profile: "baja_2027"
  profile_dir: "vehicle_profiles/"
  hal_backend: "auto"
  network_protocol: "can"
  ros2:
    enabled: false
    node_name: "apex_perception_node"
    namespace: "apex"
