# APEX-Vision Core v3.0 Universal Vehicle Profile: AGV Warehouse
profile_name: "agv_warehouse"
vehicle_type: "industrial_agv"
description: "Precision indoor differential / Ackermann AGV with docking millimeter accuracy."

kinematics:
  wheelbase_m: 1.10
  track_width_m: 0.85
  wheel_radius_m: 0.15
  steering_ratio: 1.0
  max_steering_angle_deg: 45.0
  max_steering_rate_deg_s: 90.0
  steering_deadband_deg: 0.05
  center_of_gravity_height_m: 0.25

dynamics:
  max_speed_kmh: 12.0
  nominal_cruise_speed_kmh: 6.0
  max_acceleration_mpss: 1.0
  max_service_deceleration_mpss: 2.5
  emergency_braking_deceleration_mpss: 4.0
  max_lateral_acceleration_mpss: 1.2
  chassis_mass_kg: 450.0

actuation:
  steering_actuator_type: "differential_torque_can"
  steering_can_id: 0x100
  throttle_actuator_type: "dual_motor_can"
  braking_actuator_type: "electromagnetic_brake"
  control_loop_frequency_hz: 100

safety:
  watchdog_timeout_ms: 300
  rss_standstill_distance_m: 0.8
  rss_response_time_s: 0.20
  kinematic_dead_reckoning_max_s: 5.0
