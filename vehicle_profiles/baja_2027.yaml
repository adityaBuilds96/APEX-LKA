name: "baja_2027"
vehicle_type: "offroad_buggy"
description: "BAJA SAE 2027 Single-Seater High-Torque Off-Road Buggy"

kinematics:
  wheelbase_m: 1.45
  track_width_m: 1.25
  max_steer_angle_deg: 32.0
  ackermann_ratio: 0.85
  min_turning_radius_m: 3.20
  understeer_gradient: 0.0025

camera_extrinsics:
  mount_height_m: 1.25
  pitch_deg: -5.0
  roll_deg: 0.0
  yaw_deg: 0.0
  x_offset_m: 0.0
  z_offset_m: 0.40
  fov_deg: 90.0

actuation:
  pwm_min: 1000
  pwm_max: 2000
  pwm_center: 1500
  center_trim: 0
  direction_sign: 1
  rate_limit_deg_per_sec: 180.0
  lut_steering:
    - [-32.0, 1000.0]
    - [-20.0, 1180.0]
    - [-10.0, 1340.0]
    - [0.0, 1500.0]
    - [10.0, 1660.0]
    - [20.0, 1820.0]
    - [32.0, 2000.0]
  lut_throttle:
    - [0.0, 1500.0]
    - [0.3, 1680.0]
    - [0.7, 1860.0]
    - [1.0, 2000.0]
  lut_brake:
    - [0.0, 1500.0]
    - [0.4, 1300.0]
    - [1.0, 1000.0]

safety_limits:
  max_speed_mps: 6.94
  max_accel_mpss: 2.5
  max_decel_mpss: 4.5
  emergency_decel_mpss: 6.0
  min_standstill_distance_m: 1.5
  lateral_error_limit_m: 1.2
  max_steering_angle_deg: 32.0
