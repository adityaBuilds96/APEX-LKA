name: "campus_shuttle"
vehicle_type: "passenger_shuttle"
description: "Autonomous Low-Speed Multi-Passenger Campus Transit Shuttle"

kinematics:
  wheelbase_m: 2.60
  track_width_m: 1.55
  max_steer_angle_deg: 28.0
  ackermann_ratio: 1.00
  min_turning_radius_m: 5.50
  understeer_gradient: 0.0015

camera_extrinsics:
  mount_height_m: 1.80
  pitch_deg: -3.0
  roll_deg: 0.0
  yaw_deg: 0.0
  x_offset_m: 0.0
  z_offset_m: 0.60
  fov_deg: 95.0

actuation:
  pwm_min: 1100
  pwm_max: 1900
  pwm_center: 1500
  center_trim: 10
  direction_sign: 1
  rate_limit_deg_per_sec: 60.0
  lut_steering:
    - [-28.0, 1100.0]
    - [-15.0, 1300.0]
    - [0.0, 1500.0]
    - [15.0, 1700.0]
    - [28.0, 1900.0]
  lut_throttle:
    - [0.0, 1500.0]
    - [0.5, 1700.0]
    - [1.0, 1900.0]
  lut_brake:
    - [0.0, 1500.0]
    - [0.5, 1300.0]
    - [1.0, 1100.0]

safety_limits:
  max_speed_mps: 4.17
  max_accel_mpss: 1.2
  max_decel_mpss: 2.5
  emergency_decel_mpss: 4.0
  min_standstill_distance_m: 2.5
  lateral_error_limit_m: 0.6
  max_steering_angle_deg: 28.0
