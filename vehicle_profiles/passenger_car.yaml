name: "passenger_car"
vehicle_type: "passenger_ev"
description: "Production Passenger Electric Vehicle / Highway Sedan"

kinematics:
  wheelbase_m: 2.80
  track_width_m: 1.62
  max_steer_angle_deg: 35.0
  ackermann_ratio: 0.95
  min_turning_radius_m: 5.40
  understeer_gradient: 0.0030

camera_extrinsics:
  mount_height_m: 1.35
  pitch_deg: -2.0
  roll_deg: 0.0
  yaw_deg: 0.0
  x_offset_m: 0.0
  z_offset_m: 0.80
  fov_deg: 85.0

actuation:
  pwm_min: 1000
  pwm_max: 2000
  pwm_center: 1500
  center_trim: -5
  direction_sign: 1
  rate_limit_deg_per_sec: 90.0
  lut_steering:
    - [-35.0, 1000.0]
    - [-15.0, 1285.0]
    - [0.0, 1500.0]
    - [15.0, 1715.0]
    - [35.0, 2000.0]
  lut_throttle:
    - [0.0, 1500.0]
    - [0.5, 1750.0]
    - [1.0, 2000.0]
  lut_brake:
    - [0.0, 1500.0]
    - [0.5, 1250.0]
    - [1.0, 1000.0]

safety_limits:
  max_speed_mps: 22.22
  max_accel_mpss: 2.0
  max_decel_mpss: 4.0
  emergency_decel_mpss: 7.0
  min_standstill_distance_m: 3.0
  lateral_error_limit_m: 0.80
  max_steering_angle_deg: 35.0
