name: APEX-Vision Autonomous Vehicle Regression CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  av_regression_test:
    name: ISO 26262 & SIL Autonomous Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 can-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy opencv-python-headless cryptography pyyaml

      - name: Execute Autonomous Perception & Controls Unit Tests
        run: |
          pytest tests/test_perception_v3.py -v
          pytest tests/test_depth_occupancy.py -v
          pytest tests/test_tracking_prediction.py -v
          pytest tests/test_eskf_localization.py -v
          pytest tests/test_planner_rss.py -v
          pytest tests/test_ota_harvester.py -v
          pytest tests/test_carla_simulation.py -v

      - name: Verify End-to-End Latency Budget (< 15ms)
        run: |
          python -c "
          import time, numpy as np
          from src.planning.teb_planner import TEBPathPlanner
          from src.safety.rss_shield import MobileyeRSSShield

          planner = TEBPathPlanner()
          shield = MobileyeRSSShield()

          times = []
          for _ in range(50):
              t0 = time.perf_counter()
              _ = shield.evaluate_threat(15.0, 20.0, 12.0)
              _ = planner.plan(15.0, 15.0, (0.001, 0.05, 0.0))
              times.append((time.perf_counter() - t0) * 1000.0)

          avg_ms = float(np.mean(times))
          print(f'Average Planning + Safety Latency: {avg_ms:.2f} ms')
          assert avg_ms < 15.0, f'Latency {avg_ms:.2f}ms exceeds 15ms budget!'
          "

      - name: Check ISO 26262 ASIL-B Safety Artifacts
        run: |
          test -f docs/safety/FMEA.md
          test -f docs/safety/FTA.md
          test -f docs/safety/ASIL_B_Safety_Case.md
          test -f docs/safety/SBOM.md
          echo "All Functional Safety artifacts present and compliant."
